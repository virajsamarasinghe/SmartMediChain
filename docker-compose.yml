services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: smartmedichain
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smc-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/smartmedichain
      - MONGODB_TEST_URI=mongodb://mongo:27017/smartmedichain_test
      - BLOCKCHAIN_RPC_URL=http://smart-contract:8545
      - BLOCKCHAIN_NETWORK_URL=http://smart-contract:8545
      - AI_MODEL_API_URL=http://ai-model-api:5001
      - JWT_SECRET=smartmedichain-super-secret-jwt-key-for-development-only
      - JWT_EXPIRE=7d
      - JWT_REFRESH_SECRET=smartmedichain-refresh-token-secret-for-development
      - JWT_REFRESH_EXPIRE=30d
      - BCRYPT_SALT_ROUNDS=12
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - CORS_ORIGIN=http://localhost:3000

      - BLOCKCHAIN_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy
      smart-contract:
        condition: service_started
    volumes:
      - smart_contract_artifacts:/app/smart-contract/artifacts
    networks:
      - smc-net

  ai-model-api:
    build:
      context: ./ai-model-api
    container_name: ai-model-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - AI_MODEL_PORT=5001
      - AI_MODEL_HOST=0.0.0.0
      - FRAUD_MODEL_PATH=./models/fraud_detection_model.pkl
      - FRAUD_SCALER_PATH=./models/fraud_scaler.pkl
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5000,http://frontend:3000
      - LOG_LEVEL=INFO
      - LOG_FILE=./logs/ai_model_api.log
      - MIN_CONFIDENCE_THRESHOLD=0.7
      - MAX_PREDICTION_TIME_SECONDS=5
      - CACHE_ENABLED=True
      - CACHE_TTL_SECONDS=300
    volumes:
      - ./ai-model-api/models:/app/models
      - ./ai-model-api/logs:/app/logs
    networks:
      - smc-net

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # For browser access from host machine - these URLs are used by the browser, not the container
      - REACT_APP_API_URL=http://localhost:3001/api
      - REACT_APP_BACKEND_URL=http://localhost:3001
      - REACT_APP_AI_MODEL_API_URL=http://localhost:5001
    depends_on:
      - backend
      - ai-model-api
    networks:
      - smc-net

  smart-contract:
    build:
      context: ./smart-contract
    container_name: smart-contract
    restart: unless-stopped
    command: ./start.sh
    ports:
      - "8545:8545"
    volumes:
      - smart_contract_artifacts:/app/artifacts
    networks:
      - smc-net

volumes:
  mongo_data:
  smart_contract_artifacts:


networks:
  smc-net:
    driver: bridge
